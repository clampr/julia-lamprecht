services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
    volumes:
      - ./frontend/public:/var/www/html
    ports:
      - "8080:80"
